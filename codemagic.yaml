workflows:
  flutter-ios-unsigned-ipa:
    name: MGR Kendang iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS device app
        script: |
          flutter build ios --release --no-codesign --no-pub
      - name: Create unsigned IPA
        script: |
          set -e
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          test -d build/ios/iphoneos/Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry MGR-Kendang.ipa Payload
    artifacts:
      - build/ios/ipa/MGR-Kendang.ipa
